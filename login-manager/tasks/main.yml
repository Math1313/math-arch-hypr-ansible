---
# tasks file for login-manager
- name: Install packages
  community.general.pacman:
    name: "{{ item }}"
    state: installed
  with_items: "{{ repos }}"

- name: Configure greetd to use tuigreet
  ansible.builtin.lineinfile:
    path: /etc/greetd/config.toml
    regexp: '^command\s*='
    line: "command = \"tuigreet --time --remember --cmd 'uwsm start hyprland.desktop' --theme 'border=lightblue;text=white;prompt=lightcyan;time=lightblue;action=gray;button=white;container=black;input=white'\""

- name: Enable greetd service
  ansible.builtin.systemd_service:
    enabled: true
    name: greetd


