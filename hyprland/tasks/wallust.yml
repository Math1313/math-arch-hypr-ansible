---

- name: Clone Wallust repository
  become: true
  become_user: "{{ user }}"
  ansible.builtin.git:
    repo: https://codeberg.org/usaradark/wallust.git
    dest: "/tmp/wallust"
    version: master
    update: true

- name: Build Wallust
  become: true
  become_user: "{{ user }}"
  ansible.builtin.command:
    cmd: make
    chdir: "/tmp/wallust"
    creates: "/tmp/wallust/target/release/wallust"

- name: Install Wallust
  become: true
  ansible.builtin.command:
    cmd: make install
    chdir: "/tmp/wallust"
    creates: "/usr/local/bin/wallust"

- name: Copy wallust configuration file
  become_user: "{{ user }}"
  ansible.builtin.copy:
#    src: "~/.config/custom_dotfiles/.config/hypr"
    src: "{{ dotfiles_folder }}/wallust"
    dest: "~/.config/"
