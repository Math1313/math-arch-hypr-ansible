---

- name: Clone Wallust repository
  become: true
  become_user: "{{ user }}"
  ansible.builtin.git:
    repo: https://codeberg.org/usaradark/wallust.git
    dest: "/tmp/wallust"
    version: master
    update: true

- name: Build Wallust
  become: true
  become_user: "{{ user }}"
  ansible.builtin.command:
    cmd: make
    chdir: "/tmp/wallust"
  register: wallust_build
  changed_when: "'Finished' in wallust_build.stdout or wallust_build.rc == 0"

- name: Install Wallust
  become: true
  ansible.builtin.command:
    cmd: make install
    chdir: "/tmp/wallust"
