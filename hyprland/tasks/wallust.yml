---

- name: Install Wallust
  kewlfft.aur.aur:
    use: yay
    state: present
    name:
      - wallust
  become: yes
  become_user: aur_builder
  register: wallust_install
  retries: 3
  delay: 10
  until: wallust_install is succeeded
  ignore_errors: yes

- name: Copy wallust configuration file
  become_user: "{{ user }}"
  ansible.builtin.copy:
#    src: "~/.config/custom_dotfiles/.config/hypr"
    src: "{{ dotfiles_folder }}/wallust"
    dest: "~/.config/"
