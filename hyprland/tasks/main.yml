---
# tasks file for hyprland
#
- name: Install pakages 
  community.general.pacman:
    name: "{{ item }}"
    state: installed
  with_items: "{{ repos }}"

- name: Copy hypr files in custom configuration
  become_user: "{{ user }}"
  ansible.builtin.copy:
    src: "{{ dotfiles_folder}}/hypr"
    dest: "~/.config/"
    mode: preserve

- name: Check if Hyprland is running
  become: true
  become_user: "{{ user }}"
  ansible.builtin.command:
    cmd: hyprctl instances
  register: hyprland_status
  changed_when: false
  failed_when: false

- name: Reload Hyprland configuration
  become: true
  become_user: "{{ user }}"
  ansible.builtin.command:
    cmd: hyprctl reload
  when:
    - hyprland_status.rc == 0
    - hyprland_status.stdout | length > 0
  changed_when: true
  failed_when: false

- name: Enable hypridle service
  become_user: "{{ user }}"
  ansible.builtin.systemd_service:
    enabled: true
    name: hypridle
    scope: user
    state: started

- name: Install and build Wallust
  ansible.builtin.include_tasks:
    file: wallust.yml

- name: Install and build fonts
  ansible.builtin.include_tasks:
    file: fonts.yml

- name: Import kitty configuration file
  ansible.builtin.include_tasks:
    file: kitty.yml

- name: Enable application dark theme
  ansible.builtin.include_tasks:
    file: dark_theme.yml

- name: Copy wallpapers to local directory 
  become_user: "{{ user }}"
  ansible.builtin.copy:
    src: "{{ dotfiles_folder }}/../wallpapers"
    dest: "~/Images/"
    mode: preserve

- name: Copy fuzzel script
  become_user: "{{ user }}"
  ansible.builtin.copy:
    src: "{{ dotfiles_folder }}/fuzzel"
    dest: "~/.config/"
    mode: "0755"
