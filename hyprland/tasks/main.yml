---
# tasks file for hyprland
#
- name: Install pakages 
  community.general.pacman:
    name: "{{ item }}"
    state: installed
  with_items: "{{ repos }}"

- name: Install and configure arttime
  ansible.builtin.include_tasks:
    file: arttime.yml

- name: Copy btop configuration files
  become_user: "{{ user }}"
  ansible.builtin.copy:
    src: "{{ dotfiles_folder }}/btop"
    dest: "~/.config/"

- name: Copy hypr files in custom configuration
  become_user: "{{ user }}"
  ansible.builtin.copy:
    src: "{{ dotfiles_folder}}/hypr"
    dest: "~/.config/"
    mode: preserve

- name: Find Hyprland custom scripts
  become_user: "{{ user }}"
  ansible.builtin.find:
    paths: "~/.config/hypr/scripts/"
    file_type: file
  register: hypr_custom_scripts

- name: Make Hyprland custom scripts executable
  become_user: "{{ user }}"
  ansible.builtin.file:
    path: "{{ item.path }}"
    mode: "0755"
  loop: "{{ hypr_custom_scripts.files }}"

- name: Check if Hyprland is running
  become: true
  become_user: "{{ user }}"
  ansible.builtin.command:
    cmd: hyprctl instances
  register: hyprland_status
  changed_when: false
  failed_when: false

- name: Reload Hyprland configuration
  become: true
  become_user: "{{ user }}"
  ansible.builtin.command:
    cmd: hyprctl reload
  when:
    - hyprland_status.rc == 0
    - hyprland_status.stdout | length > 0
  changed_when: true
  failed_when: false

- name: Enable hypridle service
  become_user: "{{ user }}"
  ansible.builtin.systemd_service:
    enabled: true
    name: hypridle
    scope: user
    state: started

- name: Configure waybar
  ansible.builtin.include_tasks:
    file: waybar.yml

- name: Install and config Monique
  ansible.builtin.include_tasks:
    file: monique.yml

- name: Install and build Wallust
  ansible.builtin.include_tasks:
    file: wallust.yml

- name: Install and build fonts
  ansible.builtin.include_tasks:
    file: fonts.yml

- name: Import kitty configuration file
  ansible.builtin.include_tasks:
    file: kitty.yml

- name: Configure pokefetch
  ansible.builtin.include_tasks:
    file: pokefetch.yml

- name: Enable application dark theme
  ansible.builtin.include_tasks:
    file: dark_theme.yml

- name: Configure ZSH
  ansible.builtin.include_tasks:
    file: custom_zsh.yml

- name: Copy wallpapers to local directory 
  become_user: "{{ user }}"
  ansible.builtin.copy:
    src: "{{ dotfiles_folder }}/../wallpapers"
    dest: "~/Images/"
    mode: preserve

- name: Copy fuzzel script
  become_user: "{{ user }}"
  ansible.builtin.copy:
    src: "{{ dotfiles_folder }}/fuzzel"
    dest: "~/.config/"
    mode: "0755"
