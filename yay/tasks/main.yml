---
# tasks file for yay

- name: Install yay dependency
  become: true
  community.general.pacman:
    name:
      - base-devel
    state: present

- name: Clone yay
  become_user: "{{ user }}"
  git:
    repo: https://aur.archlinux.org/yay.git
    dest: "/tmp/yay"

- name: Compile and install yay
  become_user: "{{ user }}"
  command: makepkg -si --noconfirm
  args:
    chdir: "/tmp/yay"
    creates: /usr/bin/yay
