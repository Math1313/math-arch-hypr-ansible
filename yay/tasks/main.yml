---
# tasks file for yay

- name: Install yay dependency
  become: true
  community.general.pacman:
    name:
      - base-devel
      - go
    state: present

- name: Clone yay
  become_user: "{{ user }}"
  git:
    repo: https://aur.archlinux.org/yay.git
    dest: "/tmp/yay"

- name: Compile yay
  become: true
  become_user: "{{ user }}"
  ansible.builtin.command: 
    cmd: makepkg -s --noconfirm
    chdir: "/tmp/yay"
    creates: "/tmp/yay/yay-*.pkg.tar.zst"

- name: Find compile package
  ansible.builtin.find:
    paths: "/tmp/yay"
    patterns: "yay-*.pkg.tar.zst"
    file_type: file
  register: yay_packages

- name: Install yay
  become: true
  community.general.pacman:
    name: "{{ yay_packages.files | map(attribute='path') | list }}"
    state: present
  when: yay_packages.matched > 0
